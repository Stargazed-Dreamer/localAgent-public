[component]
name = "wuwa_gacha"
version = "0.1.0"
description = "鸣潮抽卡记录日志解密/内存扫描+API采集"
project_tag = "wuwa_gacha"
enabled = true

[exports.runtime]
files = []

[exports.source]
# G3 决策（2026-08-10）：白名单只含代码+文档，所有 *.json 均为个人记录（database/raw_*/summary*），raw/ 排除
files = [
    "workspace/wuwa_gacha/*.py",
    "workspace/wuwa_gacha/SKILL.md",
    "workspace/wuwa_gacha/manifest.toml",
]

[release_facts]
contains_personal_data = false
requires_external_credentials = false
# 2026-08-10 T-v4: 升级为 apache-2.0（requests=Apache-2.0 兼容；G16b 借鉴余地声明）
# 审查记录：temp/sdd/release-engine/license-review-v4/wuwa_gacha.md
license_class = "apache-2.0"

[agent_guide]
file = "loop_actions.py"
entries_var = "GUIDE_REGISTRY_ENTRIES"

[skill]
file = "SKILL.md"
task_type = "recurring.wuwa_gacha"
index_section = "components"

[backup]
# 备份声明（与 [watch] 解耦）：仅含个人抽卡记录，由 WorkspaceBackupAction loop 调度
# "raw/" 是目录 → 备份时打 zip（raw_YYYYMMDD_HHMMSS.zip），含原始 API 响应（不可再生）
# 消费方：tools/backup_workspace.py → backups/workspace/wuwa_gacha/<basename>_<ts>.<ext|zip>
# 备份频次见 config.toml [loops.workspace_backup]
paths = ["wuwa_gacha_database.json", "wuwa_gacha_summary.json", "raw/"]

[tests]
# 自动化测试声明：当前无自动化测试
enabled = false
paths = []
