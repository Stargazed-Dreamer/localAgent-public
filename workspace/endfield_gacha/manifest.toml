[component]
name = "endfield_gacha"
version = "0.1.0"
description = "终末地寻访游戏日志/API采集"
project_tag = "endfield_gacha"
enabled = true

[exports.runtime]
files = []

[exports.source]
# G3 决策（2026-08-10）：白名单含 config_schema.toml，排除 char_records.json/weapon_records.json/summary.json/raw/
files = [
    "workspace/endfield_gacha/*.py",
    "workspace/endfield_gacha/SKILL.md",
    "workspace/endfield_gacha/manifest.toml",
    "workspace/endfield_gacha/config_schema.toml",
]

[release_facts]
contains_personal_data = false
requires_external_credentials = false
# 2026-08-10 T-v4: 升级为 apache-2.0（httpx=BSD, playwright=Apache-2.0, playwright_stealth=MIT 兼容；G16b 借鉴余地声明）
# 审查记录：temp/sdd/release-engine/license-review-v4/endfield_gacha.md
license_class = "apache-2.0"

[agent_guide]
file = "loop_actions.py"
entries_var = "GUIDE_REGISTRY_ENTRIES"

[skill]
file = "SKILL.md"
task_type = "recurring.endfield_gacha"
index_section = "components"

[config_schema]
file = "config_schema.toml"

[backup]
# 备份声明（与 [watch] 解耦）：仅含个人寻访记录，由 WorkspaceBackupAction loop 调度
# "raw/" 是目录 → 备份时打 zip（raw_YYYYMMDD_HHMMSS.zip），含原始 API 响应（不可再生）
# 消费方：tools/backup_workspace.py → backups/workspace/endfield_gacha/<basename>_<ts>.<ext|zip>
# 备份频次见 config.toml [loops.workspace_backup]
paths = ["summary.json", "weapon_records.json", "char_records.json", "raw/"]

[tests]
# 自动化测试声明：当前无自动化测试
enabled = false
paths = []
