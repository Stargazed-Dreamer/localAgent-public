schema_version = 1

# Friend audience policy — phase 4 加 core_files + phase 2 加 7 个新组件（2026-08-10）
#
# spec-v4 决策 G8：friend.toml 阶段 1 同步加 core_files（不加 7 个新组件）。
# 阶段 2 决策 P5 调整：friend.toml 加 7 个新组件（accounting/dev_toolkit/life_design/4 gacha），
# 朋友包也能用这些功能（代码不含个人数据，数据文件由 exports 白名单排除）。
# core_files / core_files_exclude 范围与 public.toml 一致（G5 决策）。
#
# 与 public.toml 的差异：
#   - components 不同（friend 12 个含 web_archive/niuke_review + 10 public 组件；public 10 个不含 web_archive/niuke_review）
#   - allow_exemptions = true（friend 允许 line_skips / post_process_remove_lines）
#   - require_license_clearance = false（niuke_review/web_archive 仍 internal-review，开 gate 会失败）
#   - static gates 少 2 个（无 license-clearance / no-agpl-import）
#   - build_time gates 少 1 个（无 sbom-generated）
#   - core_files / core_files_exclude 范围一致（G5 决策）
#
# 详见 temp/sdd/release-engine/spec-v4-public-full.md

[audience]
name = "friend"
profile = "friend-full"
# friend 受众允许的组件清单（从原 friend-full.toml [scope].include_components 迁移）
# 注：auto_shutdown 已重构为 server/auto_shutdown.py 后端模块（非 workspace 组件），自然包含在 server/ 中，不再单独列为组件
# 注：G8 决策——阶段 1 friend 不加 7 个新组件；阶段 2 P5 决策调整——friend 加 7 个新组件
#       （accounting/dev_toolkit/life_design/4 gacha），朋友包也能用这些功能
components = [
  "web_archive",
  "niuke_review",
  "disk_manager",
  "recorder",
  "modelscope_model_update",
  "accounting",
  "dev_toolkit",
  "life_design",
  "arknights_gacha",
  "wuwa_gacha",
  "endfield_gacha",
  "yihuan_gacha",
]
# 使用每组件的 exports.source.files（含源码 + 测试 + 文档）
export_set = "source"
# friend 受众允许敏感内容豁免（line_skips / post_process_remove_lines）
allow_exemptions = true
# friend 受众不需要许可证清关（niuke_review/web_archive 仍 internal-review，开 license_clearance gate 会失败）
require_license_clearance = false

# spec-v4 决策 G1/G14/G8：core_files 是核心代码 glob 清单，与 components 的 manifest.exports glob 并列，
# 共同展开为 file_entries。core_files_exclude 是排除 glob 清单，与 .gitignore 语义类似。
# friend.toml 和 public.toml 的 core_files / core_files_exclude 范围一致（G5 决策）。
core_files = [
  # 核心代码目录
  "server/**",
  "client/**",
  "lib/**",
  "tools/**",
  "docs/**",
  "tests/**",
  ".agents/skills/**",
  ".agents/rules/**",
  ".github/workflows/**",

  # release 配置（audience/ 保留；profiles/ 排除——含 friend-full/public-full 配置）
  "release/audience/**",
  "release/templates/**",
  "release/dependency_audit.json",
  "release/dependency_map.toml",

  # 根目录配置文件（start*.bat 不含个人路径，已确认）
  "AGENTS.md",
  "CHANGELOG.md",
  "LICENSE",
  "NOTICE.md",
  "README_public.md",
  "SECURITY-RISKS.md",
  "config.example.toml",
  "pyproject.toml",
  "tools_manifest.json",
  ".gitignore",
  ".python-version",
  "uv.lock",
  "start.bat",
  "start_approval_panel.bat",
  "start_client.bat",
]

core_files_exclude = [
  # 测试文件（内部组件专用测试 + 依赖 policy.toml 的 v2 测试 + release-engine v4 自测，朋友包不含 policy.toml/release-engine 内部实现）
  # 注：tests/test_release_v4.py 故意构造敏感样本验证 scanner 排除逻辑，
  # scanner 不区分测试代码，必须从发布包排除（与 test_gh_mirror_release.py 同性质处理）
  "tests/release_ci/test_gh_mirror_release.py",
  "tests/release_ci/test_release_policy.py",
  "tests/release_ci/test_release_v4.py",

  # 源仓库 README（朋友包用 README_public.md → README.md，build 期 path_renames 处理）
  "README.md",

  # 个人待办（含个人开发笔记：股票面板、卡池可视化等）
  "todo.txt",

  # 个人规划（git ls-files 确认被跟踪：github-app-bot/public-release/v6 设计文档等）
  "planning_notes/**",

  # IDE 配置（.trae/rules/project_rules.md 与 .agents/rules/project_rules.md 重复）
  ".trae/**",
  ".codebuddy/**",

  # 第三方配置（.dcg/ 目录 + .dcg.toml 配置文件一致排除）
  ".dcg/**",
  ".dcg.toml",

  # release v1 遗留（G18 调整：保留作为不变量声明，但朋友包不含）
  "release/policy.toml",

  # release profiles（含 friend-full/public-full 配置，"别人拿去还是坏处多"）
  "release/profiles/**",

  # release 产物目录（空目录/构建产物，不应进入朋友包）
  "release/dist/**",
  "release/plans/**",
  "release/staging/**",

  # .agents WIP（工作进行中笔记，个人维护用）
  ".agents/wip/**",

  # 个人系统重建内容（个人路径密集，friend 决策 2026-07-18 起即排除；2026-09-12
  # triage 核对确认仍有 100+ 行本机路径残留，public/friend 同步排除）
  "workspace/disk_manager/system_rebuild/**",
]

[audience.gates]
# 静态 gates（prepare_release 跑，失败不产 plan）
static = [
  "policy-schema",
  "tracked-file-inventory",
  "sensitive-content-scan",
  "manifest-audit",
]
# 构建期 gates（build_release 跑，失败 .failed.zip 留 staging）
build_time = [
  "no-key-startup",
  "activity-task-safe-stop",
  "focused-tests",
  "archive-verification",
]
